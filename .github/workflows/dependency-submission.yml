name: Dependency graph

# Submits the resolved Gradle dependency graph so Dependabot alerts and dependency review can
# see Gradle dependencies. Runs only for trusted code on main.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required by the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
