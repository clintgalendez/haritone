name: Release

# Runs only when a maintainer pushes a version tag (a ruleset restricts tag creation to admins).
# Nothing is published until the maintainer approves the protected `release` environment.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # Release builds never use a cache, so no cached state can influence them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Validate the tag against the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a semantic version (vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match gradle.properties version $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Full build and test suite
        run: ./gradlew build :plugin:cyclonedxDirectBom --no-build-cache --stacktrace

      - name: Check the jar is reproducible
        run: |
          sha256sum plugin/build/libs/*.jar | tee first.sha256
          ./gradlew clean :plugin:jar :plugin:cyclonedxDirectBom --no-build-cache
          sha256sum -c first.sha256

      - name: Assemble release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp "plugin/build/libs/haritone-$VERSION.jar" dist/
          cp plugin/build/reports/cyclonedx-direct/bom.json "dist/haritone-$VERSION.cdx.json"
          cp LICENSE NOTICE CHANGELOG.md dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/haritone-*.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release # requires maintainer approval
    permissions:
      contents: write
    steps:
      # No checkout: this privileged job never runs repository code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Haritone $VERSION" \
            $PRERELEASE
